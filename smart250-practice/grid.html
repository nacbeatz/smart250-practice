<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid & Flex</title>
    <link rel="stylesheet" href="styles/grid.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Merriweather:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section>
      <div class="grid-header">
        <div class="grid-header-1">Header</div>
      </div>
      <article class="grid-article">
        <div class="grid-box">
          <div class="grid-item-1">Header</div>
          <div class="grid-item-2">Paragraph-1</div>
        </div>
        <div class="grid-paragraph-aside">
          <div class="item item-a">Pargraph-2</div>
          <div class="item item-b">Aside</div>
        </div>
        <footer class="my-footer">
          <p class="right">&copy; 2025 Neknobaa</p>
        </footer>
      </article>
    </section>
  </body>
</html>
