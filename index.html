<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
<header>
<img src="images/logo.png" alt="" class="logo">
<nav>
  <ul>
    <li><a href="#">Become a rental</a></li>
    <li><a href="#">Rental deal</a></li>
    <li><a href="#">How it works?</a></li>
    <li><a href="#">Why Choose us?</a></li>
  </ul>
</nav>
<div class="burger_menu">
  <button href="">Login</button>
  <img src="images/icons8-menu.png" alt="">
</div>
</header>

<main>
  <section class="hero_section">
    <aside>
      <div class="hero_text">
        <h1>Find, book, and 
          rental car in <span>Easy</span>
          steps.</h1>
        <p>Experience the freedom of the open road with our hassle-free car rental service.</p>
        <button class="hero_button">Book Now</button>
      </div>
      <div class="hero_image">
        <img src="images/hero_car.png" alt="">
      </div>
    </aside>
    <img
      src="images/toppng.com-mg5-blue-car-2020-789x411.png"
      alt=""
      class="hero_background">
  </section>

  
<section class="search_section">
  <div class="search_container">
    <div class="search_item">
      <label for="pickup_location">Pickup Location</label>
      <input type="text" id="pickup_location" placeholder="Enter location">
    </div>
    <div class="search_item">
      <label for="pickup_date">Pickup Date</label>
      <input type="date" id="pickup_date">
    </div>
    <div class="search_item">
      <label for="return_date">Return Date</label>
      <input type="date" id="return_date">
    </div>
    <div class="search_item">
      <button class="search_button">Search</button>
    </div>
  </div>

</section>
</main>

<footer>
  Footer
</footer>







</body>
</html>
